name: Portable Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-win-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify reviewed execution boundary
        shell: pwsh
        run: |
          $patterns = @(
            'ProcessStartInfo\.Arguments',
            'cmd /c',
            'RunCommandAsync\(\s*"',
            'RunPowerShellAsync\(\s*\$'
          )
          $matches = foreach ($pattern in $patterns) {
            Get-ChildItem -Path src\WDigger -Recurse -Filter *.cs | Select-String -Pattern $pattern
          }
          if ($matches) {
            $matches | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw "Found a legacy command-string execution path."
          }
          Get-ChildItem -Path src\WDigger\PowerShell\Scripts -Filter *.ps1 | ForEach-Object {
            $script = $_
            try { [void][ScriptBlock]::Create((Get-Content -LiteralPath $script.FullName -Raw)) }
            catch { throw "PowerShell syntax validation failed for $($script.Name): $($_.Exception.Message)" }
          }

      - name: Run safety tests
        run: dotnet run --project "tests\WDigger.SafetyTests\WDigger.SafetyTests.csproj" -c Release

      - name: Restore
        run: dotnet restore "src\WDigger\WDigger.csproj"

      - name: Build
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet build "src\WDigger\WDigger.csproj" -c Release --no-restore -v:m 2>&1 | Tee-Object -FilePath build.log
          "exitcode=$LASTEXITCODE" >> $env:GITHUB_OUTPUT

      - name: Annotate build errors
        if: steps.build.outputs.exitcode != '0'
        shell: pwsh
        run: |
          $pattern = '(?i)(error|exception|failed)\b'
          $lines = @(Get-Content build.log | Where-Object { $_ -match $pattern } | Select-Object -First 60)
          if ($lines.Count -eq 0) { $lines = @(Get-Content build.log | Select-Object -Last 60) }
          foreach ($l in $lines) { Write-Output ("::error::" + ($l -replace "`r", "" -replace "`n", " ")) }
          exit 1

      - name: Validate embedded PowerShell script catalog
        shell: pwsh
        run: |
          $assemblyPath = Get-ChildItem "src\WDigger\bin\Release" -Recurse -Filter WDigger.dll |
            Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if ($null -eq $assemblyPath) { throw "WDigger.dll was not produced by the build." }
          $assembly = [Reflection.Assembly]::LoadFrom($assemblyPath.FullName)
          $catalog = $assembly.GetType('WDigger.Core.PowerShellScriptCatalog', $true)
          $identifierType = $assembly.GetType('WDigger.Core.PowerShellScriptId', $true)
          $effectType = $assembly.GetType('WDigger.Core.CommandEffect', $true)
          $create = $catalog.GetMethod('Create')
          $readOnly = [Enum]::Parse($effectType, 'ReadOnly')
          foreach ($identifier in [Enum]::GetValues($identifierType)) {
            $arguments = [string[]]@()
            if ($identifier.ToString() -notin @('AppxInventory', 'ResetWindowsUpdate')) {
              $arguments = [string[]]@('validation-value')
            }
            $invokeArguments = [object[]]@($identifier, $null, $readOnly, $null)
            $invokeArguments[1] = [string[]]$arguments
            $specification = $create.Invoke($null, $invokeArguments)
            $actual = @($specification.Arguments)
            $expectedPrefix = @('-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-EncodedCommand')
            if ($actual.Count -ne 7 -or [string]::IsNullOrWhiteSpace($actual[6])) {
              throw "Embedded script catalog invocation contract failed for $identifier."
            }
            for ($index = 0; $index -lt $expectedPrefix.Count; $index++) {
              if ($actual[$index] -cne $expectedPrefix[$index]) {
                throw "Embedded script catalog prefix failed for $identifier at argument $index."
              }
            }
          }
          Write-Host 'Embedded PowerShell script catalog verified without executing any script.'

      - name: Publish native portable EXE
        if: steps.build.outputs.exitcode == '0'
        id: publish
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet publish "src\WDigger\WDigger.csproj" -c Release -p:PublishProfile=Portable-win-x64 --no-restore 2>&1 | Tee-Object -FilePath publish.log
          "exitcode=$LASTEXITCODE" >> $env:GITHUB_OUTPUT

      - name: Annotate publish errors
        if: steps.publish.outcome == 'success' && steps.publish.outputs.exitcode != '0'
        shell: pwsh
        run: |
          $pattern = '(?i)(error|exception|failed)\b'
          $lines = @(Get-Content publish.log | Where-Object { $_ -match $pattern } | Select-Object -First 60)
          if ($lines.Count -eq 0) { $lines = @(Get-Content publish.log | Select-Object -Last 60) }
          foreach ($l in $lines) { Write-Output ("::error::" + ($l -replace "`r", "" -replace "`n", " ")) }
          exit 1

      - name: Verify single-file output
        shell: pwsh
        run: |
          $output = "artifacts\portable"
          $files = @(Get-ChildItem -LiteralPath $output -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "WDigger.exe") {
            $files | Select-Object Name, Length | Format-Table | Out-String | Write-Host
            throw "Expected exactly one portable WDigger.exe in $output"
          }
          if ($files[0].Length -lt 10MB) {
            throw "The executable is unexpectedly small for a self-contained build"
          }
          $bytes = [IO.File]::ReadAllBytes($files[0].FullName)
          $utf8 = [Text.Encoding]::UTF8.GetString($bytes)
          $unicode = [Text.Encoding]::Unicode.GetString($bytes)
          if (-not ($utf8.Contains("requireAdministrator") -or $unicode.Contains("requireAdministrator"))) {
            throw "The portable EXE does not contain the requireAdministrator manifest"
          }
          Write-Host "Portable EXE and requireAdministrator manifest verified: $($files[0].Length) bytes"

      - name: Upload WDigger portable
        uses: actions/upload-artifact@v7
        with:
          name: WDigger-portable-win-x64
          path: artifacts/portable/WDigger.exe
          if-no-files-found: error
          retention-days: 14
